<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>이미지 삽입하기</title>
    <style>
        img
        {
            border: 1px solid #ccc;
        }

        figure
        {
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>사진 선택</h1>
    <figure>
        <img src="img/leonhard.jpg" alt="바다가 보이는 좁은 골목거리">
        <figcaption>바다가 보이는 좁은 골목거리</figcaption>
    </figure>
</body>
</html>

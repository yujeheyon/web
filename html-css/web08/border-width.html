<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>border-width</title>
    <style>
        div
        {
            width: 200px;
            height: 100px;
            display: inline-block;
            margin: 15px;
            border-width: 5px;
            border: solid black;
        }

        .box1 { border-width: 2px; }
        .box2 { border-width: thick thin; }
        .box3 { border-width: 5px 10px 15px 20px; }
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
</body>
</html>

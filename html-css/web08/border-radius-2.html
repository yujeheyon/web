<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>border-radius</title>
    <style>
        div
        {
            width: 250px;
            height: 300px;
            margin: 20px;
            display: inline-block;
            border: 2px solid;
            border-radius: 70px 40px;
            background: url("../img/leonhard.jpg") no-repeat;
        }

        .bg1 { background-size: cover; }

        .bg2 { background-size: contain; }

        .bg3 { background-size: 100% 100%; }
    </style>
</head>
<body>
    <div></div>
    <div class="bg1"></div>
    <div class="bg2"></div>
    <div class="bg3"></div>
</body>
</html>

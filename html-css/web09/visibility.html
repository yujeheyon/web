<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>visibility</title>
    <style>
        img
        {
            margin: 10px;
            padding: 5px;
            border: 1px solid black;
        }

        .invisible
        {
            visibility: hidden;
        }
    </style>
</head>
<body>
    <img src="../img/dog1.jpg">
    <img src="../img/dog2.jpg" class="invisible">
    <img src="../img/dog3.jpg">
</body>
</html>

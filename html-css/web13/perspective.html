<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Transform</title>
    <style>
        #no-pers, #pers
        {
            width: auto;
            height: auto;
            border: 1px solid black;
            margin: 30px;
            float: left;
        }

        .rotatex img
        {
            transform: rotateX(50deg);
        }

        #pers
        {
            perspective: 300px;
        }
    </style>
</head>
<body>
    <h4>원본 이미지</h4>
    <div>
        <img src="../img/apples.jpg">
    </div>
    <div id="no-pers">
        <div class="rotatex">
            <img src="../img/apples.jpg">
        </div>
    </div>
    <div id="pers">
        <div class="rotatex">
            <img src="../img/apples.jpg">
        </div>
    </div>
</body>
</html>

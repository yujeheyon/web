<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Transform</title>
    <style>
        .trl
        {
            width: 100px;
            height: 100px;
            background-color: blue;
            border: 1px solid black;
            transition-property: width, height;
            transition-duration: 2s, 1s;
        }

        .trl:hover
        {
            width: 200px;
            height: 120px;
        }
    </style>
</head>
<body>
    <div class="trl"></div>
</body>
</html>

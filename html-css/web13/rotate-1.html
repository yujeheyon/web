<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Transform</title>
    <style>
        .origin
        {
            width: auto;
            height: auto;
            border: 1px solid black;
            float: left;
            margin: 40px;
        }

        .rotate1:hover
        {
            transform: rotate(20deg);
        }

        .rotate2:hover
        {
            transform: rotate(-40deg);
        }
    </style>
</head>
<body>
    <div class="origin">
        <div class="rotate1">
            <img src="../img/winter_tree.jpg">
        </div>
    </div>
    <div class="origin">
        <div class="rotate2">
            <img src="../img/winter_tree.jpg">
        </div>
    </div>
</body>
</html>

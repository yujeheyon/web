<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Transform</title>
    <style>
        h1
        {
            text-align: center;
            font-size: 52px;
        }

        .trl
        {
            width: 100px;
            height: 100px;
            background-color: red;
            border: 1px solid black;
            transition-property: backgroud-color, transform, width, height;
            transition-duration: 2s, 3s;
        }

        .trl:hover
        {
            width: 200px;
            height: 200px;
            background-color: #ff6e5f;
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <div class="trl"><h1>!</h1></div>
</body>
</html>

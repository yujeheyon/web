<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Transform</title>
    <style>
        .origin
        {
            width: auto;
            height: auto;
            border: 1px solid black;
            float: left;
            margin: 40px;
        }

        .scalex:hover
        {
            transform: scalex(1.2);
        }

        .scaley:hover
        {
            transform: scaleY(1.5);
        }

        .scale:hover
        {
            transform: scale(0.7);
        }
    </style>
</head>
<body>
    <div class="origin">
        <div class="scalex">
            <img src="../img/leonhard.jpg">
        </div>
    </div>
    <div class="origin">
        <div class="scaley">
            <img src="../img/leonhard.jpg">
        </div>
    </div>
    <div class="origin">
        <div class="scale">
            <img src="../img/leonhard.jpg">
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Transform</title>
    <style>
        .origin
        {
            width: auto;
            height: auto;
            border: 1px solid black;
            float: left;
            margin: 40px;
        }

        .skewx:hover
        {
            transform: skewX(30deg);
        }

        .skewy:hover
        {
            transform: skewY(15deg);
        }

        .skewxy:hover
        {
            transform: skew(-24deg, -15deg);
        }
    </style>
</head>
<body>
    <div class="origin">
        <div class="skewx">
            <img src="../img/road.jpg">
        </div>
    </div>
    <div class="origin">
        <div class="skewy">
            <img src="../img/road.jpg">
        </div>
    </div>
    <div class="origin">
        <div class="skewxy">
            <img src="../img/road.jpg">
        </div>
    </div>
</body>
</html>

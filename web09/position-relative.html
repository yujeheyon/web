<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS 포지셔닝</title>
    <style>
        .box1
        {
            width:100px;
            margin-right: 10px;
            padding: 20px;
            background: #ffd800;
            float: left;
        }

        .box2
        {
            position: relative;
            left: -50px;
            top: 30px;
            width: 300px;
            padding: 20px;
            background: #0095ff;
            float: left;
        }
    </style>
</head>
<body>
    <div class="box1">박스1</div>
    <div class="box2">박스2</div>
</body>
</html>

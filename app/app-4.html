<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>온라인 스토어</title>
    <style>
        #container
        {
            width: 720px;
            background-color: rgb(231, 231, 231);
            padding:20px;
        }

        h2, p
        {
            padding-left: 30px;
        }

        #view
        {
            display: flex;
            flex-wrap: wrap;
        }

        .list
        {
            width:200px;
            height:330px;
            background-color: white;
            border-radius: 15px;
            margin: 10px 20px;
        }

        .btn:hover
        {
            background-color:aliceblue;
            color:black;
        }

        .img
        {
            display: block;
            width: 180px;
            height: 180px;
            margin: 10px 10px;
            border-radius: 15px;
            background-color: rgb(192, 192, 192);
        }

        .name, .price
        {
            display:block;
            width: 180px;
            height: 30px;
            padding: 5px 10px;
        }

        .name
        {
            font-size: 20px;
            font-weight: bold;
        }

        .price
        {
            color:gray;
        }

        .btn
        {
            width: 180px;
            height: 30px;
            margin: 10px;
            border-radius: 5px;
            border: 0px solid skyblue;
            background-color: skyblue;
            color: white;
        }
    </style>
</head>
<body>
    <div id="container">
        <h2>온라인 스토어</h2>
        <p>오늘의 추천 상품</p>
        <div id="view">
            <div class="list">
                <div class="img"></div>
                <div class="name">
                    키보드
                </div>
                <div class="price">
                    45,000원
                </div>
                <button class="btn">구매하기</button>
            </div>
            <div class="list">
                <div class="img"></div>
                <div class="name">
                    마우스
                </div>
                <div class="price">
                    25,000원
                </div>
                <button class="btn">구매하기</button>
            </div>
            <div class="list">
                <div class="img"></div>
                <div class="name">
                    헤드셋
                </div>
                <div class="price">
                    60,000원
                </div>
                <button class="btn">구매하기</button>
            </div>
        </div>
    </div>
</body>
</html>

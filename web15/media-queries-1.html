<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Media Queries</title>
    <meta name="viewport" content="width-device-width, initial-scale = 1">
    <style>
        body
        {
            background: url(../img/cat-2.jpg) no-repeat fixed;
            background-size: cover;
        }

        @media screen and (max-width:1024px)
        {
            body
            {
                background: url(../img/cat-3.jpg) no-repeat fixed;
                background-size: cover;
            }
        }

        @media screen and (max-width:768px)
        {
            body
            {
                background: url(../img/cat-4.jpg) no-repeat fixed;
                background-size: cover;
            }
        }

        @media screen and (max-width:320px)
        {
            body
            {
                background: url(../img/cat-5.jpg) no-repeat fixed;
                background-size: cover;
            }
        }
    </style>
</head>
<body>
    
</body>
</html>

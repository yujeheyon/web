<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>display</title>
    <style>
        nav ul
        {
            list-style-type: none;
        }

        nav ul li
        {
            display: inline;
            padding: 10px 15px;
            margin-right: 20px;
            border-top: 3px solid #222;
        }

        nav ul li:hover
        {
            background-color: rgb(196 196 196);
        }

        nav ul li a
        {
            color:black;
            text-decoration: none;
        }

        div
        {
            border: 2px solid #222;
            padding: 10px;
        }

        div img
        {
            margin: 10px;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#">애완견 종류</a></li>
            <li><a href="#">입양하기</a></li>
            <li><a href="#">건강돌보기</a></li>
            <li><a href="#">더불어살기</a></li>
        </ul>
    </nav>
    <div>
        <img src="../img/dog1.jpg">
        <img src="../img/dog2.jpg">
        <img src="../img/dog3.jpg">
    </div>
</body>
</html>

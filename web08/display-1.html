<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title></title>
    <style>
        div
        {
            margin: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #inline img
        {
            margin: 10px;
        }

        #block img
        {
            display: block;
            width: 300px;
            height: 200px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div id="inline">
        <img src="../img/leonhard.jpg">
        <img src="../img/road.jpg">
        <img src="../img/cherryblossoms.jpg">
    </div>
    <div id="block">
        <img src="../img/leonhard.jpg">
        <img src="../img/road.jpg">
        <img src="../img/cherryblossoms.jpg">
    </div>
</body>
</html>

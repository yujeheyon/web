<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>이벤트 페이지 실습</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script>
        var num = 1;
        function gallery(direct)
        {
            if(direct)
            {
                if(num == 3) return;
                num++;
            }else
            {
                if(num == 1) return;
                num--;
            }

            var imgTag = document.getElementById("photo");
            imgTag.setAttribute("src", "../../img/lg-banner-" + num + ".png");
        }

        $(function()
        {
            $("#card-img-1").hover(function()
            {
                $("<a id='card-1'>2023 iF Design Award2023 iF Design Award 수상 제품</a>").replaceAll("#card-1");
            }, function()
            {
                $("<a id='card-1'>LG 디오스 오브제컬렉션 전자레인지23L</a>").replaceAll("#card-1");
            });

            $("#card-img-2").hover(function()
            {
                $("<a id='card-2'>메탈 히터, 광파 히터, 열풍 히터의 트리플 광파쿡과 스팀 기능을 적용한 광파오븐입니다.</a>").replaceAll("#card-2");
            }, function()
            {
                $("<a id='card-2'>LG 디오스 오브제컬렉션 광파오븐32L</a>").replaceAll("#card-2");
            });

            $("#card-img-3").hover(function()
            {
                $("<a id='card-3'>스마트 인버터 마그네트론 10년 무상보증</a>").replaceAll("#card-3");
            }, function()
            {
                $("<a id='card-3'>LG 전자레인지20L</a>").replaceAll("#card-3");
            });
            
            $("#header").on
            ({
                "mouseover" : function()
                {
                    $("#header").css({"background-color" : "black"});
                },
                "mouseout" : function()
                {
                    $("#header").css({"background-color" : "lightpink"});
                }
            })
        });
    </script>
    <style>
        #header
        {
            width: 100%;
            height:100px;
            background-color:lightpink;
        }

        #header h1
        {
            font-size: 40px;
            line-height: 90px;
            text-align: center;
            color: white;
        }
        
        .card-text a
        {
            text-decoration: none;
            color: black;
        }

        .carousel
        {
            border: 1px solid #ccc;
            margin-top: 10px;
        }

        footer
        {
            width: 100%;
            height:60px;
            background-color:lightpink;
            color:white;
            text-align: center;
            line-height: 60px;
        }
    </style>
</head>
<body>
    <div class="container-md">
        <div id="header">
            <h1>LG전자</h1>
        </div>
        <ul class="nav nav-underline">
            <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">제품</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">가전 구독</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">O&A</a>
            </li>
            <li class="nav-item">
                <a class="nav-link disabled" aria-disabled="true">고객센터</a>
            </li>
        </ul>
        <div id="carouselExampleIndicators" class="carousel slide">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="../../img/lg-banner-1.png" id="photo" class="d-block w-100" alt="...">
                </div>
            </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev" onclick="gallery(0)">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next" onclick="gallery(1)">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
            <div style="display:flex">
                <div class="card" style="width: 18rem; margin: 10px;">
                    <img src="../../img/oven-1.jpg" id="card-img-1" class="card-img-top" alt="...">
                    <div class="card-body">
                        <p class="card-text">
                            <a id="card-1" href="#">LG 디오스 오브제컬렉션 전자레인지23L</a>
                        </p>
                    </div>
                </div>
                <div class="card" style="width: 18rem; margin: 10px;">
                    <img src="../../img/oven-2.jpg" id="card-img-2" class="card-img-top" alt="...">
                    <div class="card-body">
                        <p class="card-text">
                            <a id="card-2" href="#">LG 디오스 오브제컬렉션 광파오븐32L</a>
                        </p>
                    </div>
                </div>
                <div class="card" style="width: 18rem; margin: 10px;">
                    <img src="../../img/oven-3.jpg" id="card-img-3" class="card-img-top" alt="...">
                    <div class="card-body">
                        <p class="card-text">
                            <a id="card-3" href="#">LG 전자레인지20L</a>
                        </p>
                    </div>
                </div>
            </div>
            <div style="display:flex">
                <div class="card" style="width: 18rem; margin: 10px;">
                    <img src="../../img/refresh.jpg" id="card-img-1" class="card-img-top" alt="...">
                    <div class="card-body">
                        <p class="card-text">
                            <a id="card-1" href="#">LG 디오스 AI 오브제컬렉션 냉장고 (매직스페이스)</a>
                        </p>
                    </div>
                </div>
                <div class="card" style="width: 18rem; margin: 10px;">
                    <img src="../../img/wine.jpg" id="card-img-2" class="card-img-top" alt="...">
                    <div class="card-body">
                        <p class="card-text">
                            <a id="card-2" href="#">LG 디오스 오브제컬렉션 와인셀러</a>
                        </p>
                    </div>
                </div>
                <div class="card" style="width: 18rem; margin: 10px;">
                    <img src="../../img/washdish.jpg" id="card-img-3" class="card-img-top" alt="...">
                    <div class="card-body">
                        <p class="card-text">
                            <a id="card-3" href="#">LG 디오스 오브제컬렉션 식기세척기 (빌트인/14인용)</a>
                        </p>
                    </div>
                </div>
            </div>
            <div style="display:flex">
                <div class="card" style="width: 18rem; margin: 10px;">
                    <img src="../../img/air.jpg" id="card-img-1" class="card-img-top" alt="...">
                    <div class="card-body">
                        <p class="card-text">
                            <a id="card-1" href="#">LG 퓨리케어 AI 360˚ 공기청정기 플러스</a>
                        </p>
                    </div>
                </div>
                <div class="card" style="width: 18rem; margin: 10px;">
                    <img src="../../img/conditioner.jpg" id="card-img-2" class="card-img-top" alt="...">
                    <div class="card-body">
                        <p class="card-text">
                            <a id="card-2" href="#">LG 상업용스탠드에어컨 프리미엄 PLUS</a>
                        </p>
                    </div>
                </div>
                <div class="card" style="width: 18rem; margin: 10px;">
                    <img src="../../img/massage.jpg" id="card-img-3" class="card-img-top" alt="...">
                    <div class="card-body">
                        <p class="card-text">
                            <a id="card-3" href="#">LG 힐링미 오브제컬렉션 안마의자 (아르테)</a>
                        </p>
                    </div>
                </div>
            </div>
            <footer>
                ⓒCopywriter 2026 Yubin Company
            </footer>
    </div>
</body>
</html>

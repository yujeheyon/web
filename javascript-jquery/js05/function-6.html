<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>함수</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        *
        {
            margin: 0;
            padding: 0;
        }

        #galleryZone
        {
            text-align: center;
        }

        #galleryZone input[type="image"]
        {
            margin: 0 8px;
        }
    </style>
    <script>
        var num = 1;
        function gallery(direct)
        {
            if(direct)
            {
                if(num == 8) return;
                num++;
            }else
            {
                if(num == 1) return;
                num--;
            }

            var imgTag = document.getElementById("photo");
            imgTag.setAttribute("src", "../../img/pic_" + num + ".jpg");
        }
    </script>
</head>
<body>
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand">Navbar</a>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
        </div>
    </nav>
    <!-- <div id="galleryZone">
        <p>
            <img src="../../img/pic_1.jpg" id="photo" class="border border-black">
        </p>
        <p>
            <button type="button" class="btn btn-dark" onclick="gallery(0)">이전</button>
            <button type="button" class="btn btn-dark" onclick="gallery(1)">다음</button>
        </p>
    </div> -->
    <div id="carouselExample" class="carousel slide">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="../../img/pic_1.jpg" id="photo" class="d-block w-100" alt="...">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev" onclick="gallery(0)">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next" onclick="gallery(1)">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>객체 조작 및 생성</title>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script>
        $(function()
    {
        $("<li>appendTo</li>").appendTo("#listZone");
        $("#listZone").prepend("<li>prepend</li>");
    });
    </script>
</head>
<body>
    <ul id="listZone">
        <li>리스트</li>
    </ul>
</body>
</html>

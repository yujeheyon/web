<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ID 셀렉터 연습2</title>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script>
        function addHtml()
        {
            $("#article").html("안녕하세요" + "<br>");
        }
    </script>
</head>
<body>
    <div>
        <p id="article"></p>
    </div>
    <input type="button" value="추가하기" onclick="addHtml()">
</body>
</html>

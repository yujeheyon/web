<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title></title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap');
        body 
        {
            font-family: "Do Hyeon", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
        
        div
        {
            border: 1px solid #ccc;
            width: 640px;
        }

        img
        {
            background-size: cover;
        }

        .list_text
        {
            background-color:black;
        }

        .list_text h1
        {
            text-indent: 5%;
            color: white;
        }

        .list_sub_text
        {
            padding-left: 20px;
            color:goldenrod;
            text-align: left;
        }

        .check_box h1
        {
            background-color: black;
            color: white;
            font-size: 16pt;
            padding: 5px;
            text-indent: 3%;
            margin: 0px;
        }

        p
        {
            text-align: center
        }

        h2
        {
            color:red;
            text-align: center;
            font-size: 16pt;
        }

        .blue_text
        {
            color:cornflowerblue;
        }

        .bold_text
        {
            font-size: 22pt;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="content1">
        <img src="../img/apples.jpg" alt="">
        <div class="list_text">
            <h1>가정용 꿀사과</h1>
            <p class="list_sub_text">
                흠집이 있고 약간은 못생겼지만 맛과 영양은 그대로입니다. <br>
                질좋은 사과를 저렴하게 즐겨보세요
            </p>
        </div>
    </div>
    <div class="check_box">
        <h1>확인하세요</h1>
    </div>
    <div class="content2">
        <h2>주문 및 배송</h2>
        <p class="bold_text">
            <span class="blue_text">오후 2시 이전</span> 주문건은 당일 발송합니다<br>
            2시 이후 주문건은 다음날 발송합니다(주말 제외)
        </p>
    </div>
    <div class="content3">
        <h2>교환 및 환불</h2>
        <p class="bold_text">
            불만족시 <span class="blue_text">100% 환불</span>해 드립니다<br>
            고객센터로 전화주세요
        </p>
    </div>
    <div class="content4">
        <h2>고객센터</h2>
        <p class="bold_text">
            0000-0000
        </p>
        <p>
            상담시간 : 오전 9시 ~ 오후 6시 (토/일, 공휴일 휴무)
        </p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Fluid Image</title>
    <meta name="viewport" content="width-device-width, initial-scale=1">
</head>
<body>
    <picture>
        <source srcset="../img/cat-1.jpg" media="(min-width:1024px)">
        <source srcset="../img/cat-2.jpg" media="(min-width:768px)">
        <source srcset="../img/cat-3.jpg" media="(min-width:320px)">
        <img src="../img/cat-4.jpg" style="width: 100%;">
    </picture>
</body>
</html>

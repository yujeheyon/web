<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Fluid Grid Layout</title>
    <style>
        #wrapper
        {
            width: 96%;
            margin: 0 auto;
            font-size: 12px;
        }

        .header-text
        {
            font-size: 3rem;
            text-align: center;
        }

        .fluid-text
        {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <header class="header-text">
            <p>가변 그리드 레이아웃</p>
            <p class="fluid-text">가변 폰트</p>
        </header>
    </div>
</body>
</html>

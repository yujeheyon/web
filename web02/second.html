<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>
        태그 응용
    </title>
</head>
<body>
<h1>
    가장 큰 제목
</h1>
<h6>
    가장 작은 제목
</h6>
<p>
    입력한 내용 앞뒤로 빈 줄이 생기며
    <br>
    단락 내에서 줄이 바뀝니다.
</p>
<hr>
<pre>
    공백이나   띄어쓰기가
    입력한 그대로 유지됩니다.
</pre>
<hr>
<p>
    <strong>
        strong 태그 중요한 내용 강조
    </strong>
    <br>
    <b>
        b 태그 글자만 굵게 표시
    </b>
</p>
<p>
    <em>
        em 태그 흐름상 강조 (이탤릭체)
    </em>
    <br>
    <i>
        i 태그 단순한 이탤릭체
    </i>
</p>
</body>
</html>
